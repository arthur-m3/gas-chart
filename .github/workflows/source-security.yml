name: Source security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-security:
    name: Source security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source without persistent Git credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Inspect source before dependency installation or application imports
        run: python3 -B -I -S security/check_source.py
      - name: Run security regressions without third-party packages
        run: python3 -B -I -S -m unittest discover -s security -p test_source_check.py
